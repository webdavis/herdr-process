# Keep the SHA-pinned actions and cargo dependencies fresh. The cooldown
# below damps supply-chain risk by holding back releases younger than 7 days.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

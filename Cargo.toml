[workspace]
resolver = "3"
members = [
  "crates/herdr-process-domain",
  "crates/herdr-process-application",
  "crates/herdr-process-protocol",
  "crates/herdr-process-adapters",
  "crates/herdr-process-cli",
]
default-members = ["crates/herdr-process-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
libc = "0.2"
portable-pty = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
vt100 = "=0.16.2"
